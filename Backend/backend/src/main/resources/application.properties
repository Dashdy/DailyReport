spring.application.name=DailyReport

# 环境配置（真实密码都不写在这个文件里，也不会被打进 jar 包）：
# - 开发机：Backend/backend/config/application-local.properties（已在 .gitignore 里）
# - 正式服务器：F:\DailyReport\App\config\application-prod.properties，
#   服务启动参数带 --spring.profiles.active=prod，会覆盖下面这行
# Spring Boot 会自动读取“运行目录\config\”下的配置文件，所以放在 jar 包外面也能生效。
spring.profiles.active=local

# 后端端口：Dashboard 占用 8082，这里用 8083
server.port=8083

# ---- 数据源：本项目自己的 DailyReport 库，可读写 ----
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost};instanceName=${DB_INSTANCE:SQLS2022};databaseName=${DB_NAME:DailyReport};encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# 每次启动执行 db/schema.sql：表不存在才建，已存在的表和数据不会动
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.encoding=UTF-8

# ---- 图片上传（班组照片 / 签名照片） ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
app.upload-dir=./uploads

# ---- 登录 Token：无操作超过这么多小时自动失效 ----
app.token-idle-hours=12

# ---- 企业微信推送 ----
# “ID助手”自建应用的三个参数（推送给个人）。真实值只写在服务器的 application-prod.properties 里，
# 这里留空 = 没配置，系统设置页会显示“未配置”，推送时跳过这个渠道。
app.wecom.corp-id=${WECOM_CORP_ID:}
app.wecom.agent-id=${WECOM_AGENT_ID:}
app.wecom.secret=${WECOM_SECRET:}
# 企业微信接口地址，正式环境不用改（本机测试时指向“假的企业微信”）
app.wecom.api-base=https://qyapi.weixin.qq.com
# 推送消息里“查看详情”链接用的网址
app.public-url=http://10.10.99.5:8085

