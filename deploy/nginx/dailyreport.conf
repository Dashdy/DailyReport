# 每日战报系统（DailyReport）Nginx 配置：跟 Dashboard 共用同一台服务器（10.10.99.5）上的同一个 Nginx，
# Dashboard 占 80 端口，DailyReport 单独用 8085 端口，互不影响。
#
# 浏览器访问 http://10.10.99.5:8085
#   /            → 前端静态文件（npm run build 产出的 dist）
#   /api/        → 后端 Spring Boot（只在本机 127.0.0.1:8083 监听，不直接对外）
#   /uploads/    → 后端（班组照片、签名照片，后端按“系统设置”里的存储路径去找文件）
#
# 用法：放进 Nginx 安装目录下的 conf/conf.d/（Dashboard 的 welltek.conf 也在那里），
# 主 nginx.conf 的 http {} 里已经有 include conf/conf.d/*.conf; 的话直接 nginx -s reload 即可。

server {
    listen 8085;
    server_name _;

    root F:/DailyReport/wwwroot/dist;
    index index.html;

    # 上传照片最大 10MB（Nginx 默认只允许 1MB，不改会报 413）
    client_max_body_size 20m;

    # 前端路由是 History 模式（/processes/1 这种地址），刷新页面时要回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存，前端更新后用户刷新就能拿到新版本（js/css 文件名带 hash，可以长缓存）
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8083/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8083/uploads/;
        proxy_set_header Host $host;
    }
}
